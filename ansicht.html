:root{color-scheme:light;--ink:#312410;--muted:#5b4b33;--paper:#fffdf7;--line:#d5b878;--tint:#fff1c9;--tint2:#fff7e2;--accent:#895007;--strong:#593400;--banner:#ffd970;--banner2:#fff3c8;--focus:#9d560a}
body[data-palette=b]{--ink:#18314b;--muted:#41536c;--paper:#fbfdff;--line:#9ebade;--tint:#deebff;--tint2:#f1f6ff;--accent:#244f88;--strong:#142f57;--banner:#bad6ff;--banner2:#e9f3ff;--focus:#245eaa}
body{background:linear-gradient(180deg,var(--banner2),var(--paper) 340px);color:var(--ink);min-height:100vh}
.mast{border:1px solid var(--line);border-bottom:2px solid var(--line);border-radius:14px;padding:clamp(15px,3vw,30px);background:linear-gradient(110deg,var(--banner),var(--banner2) 74%);box-shadow:0 4px 14px #52391612}
h1{color:var(--strong);font-family:Georgia,serif;letter-spacing:-.045em;font-size:clamp(2.35rem,7vw,5.2rem)}
.eyebrow{color:var(--accent)}
.sub,.muted,.matrix small{color:var(--muted)}
button{background:var(--paper);border-color:var(--line);color:var(--ink)}
button:hover,.matrix button:hover{background:var(--tint)}
.primary,.tabs button[aria-selected=true],#teamTabs button[aria-pressed=true]{background:var(--accent);color:#fff;border-color:var(--accent)}
.primary:hover{background:var(--strong)}
[data-team=a]{--tab-ink:#593400;--tab-bg:#ffdf83;--tab-line:#b38229}
[data-team=b]{--tab-ink:#19396b;--tab-bg:#cbe0ff;--tab-line:#759bd4}
.tabs button[data-team]{background:var(--tab-bg);border-color:var(--tab-line);color:var(--tab-ink)}
.tabs button[data-team][aria-selected=true],#teamTabs button[data-team][aria-pressed=true]{background:var(--tab-ink);border-color:var(--tab-ink);color:#fff}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline-color:var(--focus)}
.panel,dialog{background:var(--tint2);border-color:var(--line)}
.slot{border-color:var(--line)}
input,select,textarea{background:var(--paper);border-color:var(--line);color:var(--ink)}
.matrix{background:var(--line);border-color:var(--line);box-shadow:0 2px 8px #5239160c}
.matrix>*{background:var(--paper)}
.matrix .header{background:var(--accent);color:#fff}
.matrix .fixed{background:var(--tint);color:var(--strong)}
.warning{color:#a02414}#status{color:var(--accent)}
.screenshot-mode .mast{padding:8px 12px}.screenshot-mode .matrix button:hover{background:var(--paper)}
@media(max-width:550px){.mast{padding:14px}.matrix>*{font-size:.78rem}}

.matrix{grid-template-columns:minmax(105px,1fr) 1fr 1fr minmax(110px,1fr)}
.matrix .reserve-column{background:var(--tint2)}
.matrix .empty-reserve{color:var(--muted)}
@media(max-width:550px){.matrix{grid-template-columns:minmax(72px,.9fr) 1fr 1fr 1.15fr}.matrix>*{padding:7px 4px;font-size:.74rem}.matrix .header{overflow-wrap:normal;hyphens:auto}}
.matrix .fixed,#buildingName,#reserveBuildingTitle{white-space:pre-line}.matrix .header,.matrix .muted,.matrix .empty-reserve{white-space:pre-line}

function buildingIcon(name){
 if(name.startsWith('Feldlazarett'))return 'hospital';
 if(name.startsWith('Öl'))return 'oil';
 return ({Infozentrum:'info',Techzentrum:'science',Arsenal:'arsenal',Nuklearsilo:'silo',Söldnerfabrik:'factory'})[name];
}
function buildingCell(name){
 const cell=el('strong',undefined,'fixed building-cell');
 const graphic=planIcons[buildingIcon(name)];
 if(graphic){
  const icon=el('img',undefined,'building-icon');
  icon.src=graphic;icon.alt='';
  cell.append(icon);
 }
 cell.append(el('span',buildingLabel(name)));
 return cell;
}
function gridHead(grid){grid.append(el('strong',uiLabel('Gebäude'),'header'),el('strong',uiLabel('Zum Start'),'header'),el('strong',uiLabel('Ab Minute 10'),'header'),el('strong',uiLabel('Ersatzspieler'),'header'));}

const [fragment,directCode]=location.hash.slice(1).split('.');
const shortPlan='Ag4w3q7OQPN-3ygOcMbM-APBtWmTNHcFQyfXbMjabd85ctPGwRmJ8ji1iyjXZtTDfEjOhhQOJJyzpVYkVbOcXohw_fJ8XmpgqEnORIMF07KVUawLVgUSvlteOxPyZ_ydDmpiWpcae3l-qxQuBZQZQKG-KOcgAaDgLrZyeDKabMMDy4bY0y0c_6nvwaOH_bWIu3ExBuzqsYjyfv9WxiNjKIliXDcQa_RYt-WB4cJH0bJooCdZceErsHT5EBibzwkAxWZW7SIn9d8S42CVuXqU3kxc9aFDLQDSjWSgVUbgA5GLFUUrtP1sitZrh2ytfRTHW2o-wvzt';
if(fragment){get('code').removeAttribute('inputmode');get('gateHint').textContent='Gib den Zugangscode ein, den du zu diesem Link bekommen hast.';}
async function unlock(code){
 const button=get('unlock').querySelector('button');button.disabled=true;
 try{
  let data;
  if(!fragment){
   if(!/^\d{6}$/.test(code))throw new Error('Ungültiger Zahlencode');
   const payload=decode(shortPlan), salt=payload.slice(0,16), iv=payload.slice(16,28);
   const material=await crypto.subtle.importKey('raw',new TextEncoder().encode(code),'PBKDF2',false,['deriveKey']);
   const key=await crypto.subtle.deriveKey({name:'PBKDF2',hash:'SHA-256',salt,iterations:600000},material,{name:'AES-GCM',length:256},false,['decrypt']);
   data=await crypto.subtle.decrypt({name:'AES-GCM',iv},key,payload.slice(28));
  }else{
  if(!/^[A-Za-z0-9_-]{22}$/.test(code)||!/^[-_A-Za-z0-9]+$/.test(fragment))throw new Error('Ungültiger Code oder Link');
  const payload=decode(fragment);
  const key=await crypto.subtle.importKey('raw',decode(code),'AES-GCM',false,['decrypt']);
  data=await crypto.subtle.decrypt({name:'AES-GCM',iv:payload.slice(0,12)},key,payload.slice(12));
  }
  const json=await new Response(new Blob([data]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
  const snapshot=JSON.parse(json);
  const teams=Array.isArray(snapshot.teams)?snapshot.teams:[Array.isArray(snapshot)?{team:'a',buildings:snapshot}:snapshot];
  const tabs=get('teamTabs');tabs.hidden=teams.length<2;tabs.replaceChildren();
  function showTeam(current){
   document.body.dataset.palette=current.team;
   const grid=get('plan');
   get('teamHeading').textContent='HONL · '+label(current);
   const reserves=Array.isArray(current.reserves)?current.reserves:[];
   get('reserves').hidden=false;get('reserveList').textContent=reserves.join(' · ')||'Noch keine Ersatzspieler eingetragen.';
   get('supporterList').textContent=Array.isArray(current.supporters)?current.supporters.join(' · ')||'—':'—';
   grid.replaceChildren();gridHead(grid);
   for(const [name,first,second,reserveNames] of current.buildings){
    grid.append(buildingCell(name));
    for(const phase of [first,second]){
     const cell=el('div');if(phase===null)cell.append(el('span',uiLabel('Ab Minute 10 verfügbar'),'muted'));else cellContent(cell,phase.filter(([, ,reserve])=>!reserve));
     grid.append(cell);
    }
    const reserveCell=el('div',undefined,'reserve-column');
    const names=phase=>(phase||[]).filter(([, ,reserve])=>reserve).map(([name])=>name);
    reserveColumn(reserveCell,reserveNames??[...new Set([...names(first),...names(second)])]);grid.append(reserveCell);
   }

   controls.forEach(([plan,btn])=>btn.setAttribute('aria-pressed',String(current===plan)));
  }
  const label=plan=>plan.team==='b'?'Team B · 21:00 Uhr MEZ':'Team A · 12:00 Uhr MEZ';
  const controls=teams.map(plan=>{
   const button=el('button',label(plan));button.dataset.team=plan.team;button.addEventListener('click',()=>showTeam(plan));tabs.append(button);return [plan,button];
  });
  showTeam(teams.find(plan=>plan.team===snapshot.selected)||teams[0]);
  get('gate').hidden=true;get('view').hidden=false;
 }catch{get('status').textContent=fragment?'Der Code passt nicht zu diesem Link. Prüfe, ob du beides vollständig kopiert hast.':'Der Zahlencode ist ungültig.';}
 finally{button.disabled=false;}
}
get('unlock').addEventListener('submit',event=>{event.preventDefault();unlock(get('code').value.trim());});
if(directCode)unlock(directCode);
</script>
